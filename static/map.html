<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DEMO — obłożenie sal i plan lekcji</title>
<style>
:root {
  --bg:#eef3f9; --ink:#17324d; --muted:#65788c; --stroke:#58769b;
  --accent:#2a63d8; --room:#e8f1ff; --room-empty:#f1f4f8;
  --space:#f3f5f8; --corr:#fbfcfe; --core:#fff5d7; --shadow:0 7px 24px rgba(21,49,77,.16);
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Inter,system-ui,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink)}
#app{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr;}
#topbar{z-index:10;padding:8px 10px 6px;display:flex;gap:8px;align-items:center;background:linear-gradient(#f7fafff2,#f7faffd8);backdrop-filter:blur(10px);}
#tabs{display:flex;gap:6px;flex:1;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
#tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid #cbd8e7;background:#fff;padding:8px 11px;border-radius:10px;font-weight:700;color:var(--ink);cursor:pointer;white-space:nowrap}
.tab.active{background:#dce9ff;border-color:#7ba1ef;color:#1749a5}
#tools{display:flex;gap:5px;flex:0 0 auto}
.btn{height:40px;min-width:40px;padding:0 11px;border:0;border-radius:10px;background:white;box-shadow:0 3px 13px #17324d12;color:var(--ink);font-weight:800;font-size:16px;cursor:pointer}
#viewport{position:relative;overflow:hidden;min-height:0;touch-action:none;background:radial-gradient(circle at 50% 45%,#fff 0,#f4f7fb 60%,#eaf0f7 100%)}
#planSvg{width:100%;height:100%;display:block;user-select:none;touch-action:none}
.room{fill:#f4f6f8;stroke:#7f8fa3;stroke-width:2;transition:fill .18s ease,stroke .18s ease}.room.busy{stroke:#991b1b;stroke-width:2.4}
.space{fill:var(--space);stroke:#9ba9b8;stroke-width:1.8}
.stair{fill:url(#stairPattern);stroke:#7e8b9b;stroke-width:2}
.corridor{fill:var(--corr);stroke:#bcc8d6;stroke-width:1.7}
.core{fill:var(--core);stroke:#b18b2c;stroke-width:2}
.roomLabel{font-weight:800;fill:#17324d;text-anchor:middle;dominant-baseline:middle;pointer-events:none}
.auxLabel{font-weight:700;fill:#5e7185;text-anchor:middle;dominant-baseline:middle;pointer-events:none}
#info{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:20;width:min(1020px,calc(100% - 24px));max-height:88vh;overflow:auto;background:#fffffff8;border-radius:14px;padding:15px;box-shadow:0 18px 60px #0f172a55;display:none}
#info.show{display:block}
#info h2{margin:0 0 8px;font-size:24px}.slotLabel{font-weight:800;fill:#7f1d1d;text-anchor:middle;pointer-events:none}.heatLegend{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);margin-top:5px}.heatBar{width:120px;height:10px;border-radius:6px;background:linear-gradient(90deg,#fff1f2,#fecaca,#ef4444,#7f1d1d)}.roomSchedule{border-collapse:collapse;width:100%;font-size:12px}.roomSchedule th,.roomSchedule td{border:1px solid #d7dee8;padding:5px;vertical-align:top}.roomSchedule th{background:#eef3f9;position:sticky;top:0}.roomSchedule .period{width:54px;text-align:center;font-weight:800}.lessonItem{padding:3px 4px;margin:2px 0;border-radius:5px;background:#fee2e2}.lessonItem b{display:block}.lessonItem small{display:block;color:#64748b}.freeSlot{color:#15803d;font-weight:700;background:#f0fdf4;border-radius:5px;padding:3px 5px;display:inline-block}
#close{float:right;border:0;background:#edf2f8;border-radius:8px;width:34px;height:34px;font-size:19px;cursor:pointer}
.meta{font-size:13px;color:var(--muted);margin-bottom:8px}
#status{position:absolute;left:10px;bottom:10px;z-index:5;background:#fffffff0;border-radius:11px;padding:8px 11px;box-shadow:var(--shadow);font-size:12px;color:var(--muted)}
#floorTitle{position:absolute;left:10px;top:10px;z-index:5;background:#fffffff0;border-radius:11px;padding:8px 11px;box-shadow:var(--shadow);font-weight:800}#legend{position:absolute;left:10px;top:58px;z-index:5;background:#fffffff0;border-radius:9px;padding:6px 8px;box-shadow:var(--shadow)}
@media (max-width:700px){
  #app{grid-template-rows:auto 1fr}
  #topbar{padding:6px 7px;gap:5px}
  .tab{padding:7px 9px;font-size:13px}
  .btn{height:36px;min-width:36px;padding:0 9px;font-size:14px}
  #tools .fitText{display:none}
  #floorTitle{top:6px;left:6px;padding:6px 8px;font-size:12px}
  #status{left:6px;bottom:6px;padding:6px 8px;font-size:10px;max-width:62vw}
  #info{width:calc(100% - 12px);max-height:82vh;border-radius:13px}#legend{left:6px;top:48px}
}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div id="tabs"></div>
    <div id="tools">
      <button class="btn" id="minus" aria-label="Pomniejsz">−</button>
      <button class="btn" id="fit"><span class="fitText">Dopasuj</span><span class="fitIcon">↺</span></button>
      <button class="btn" id="plus" aria-label="Powiększ">+</button>
    </div>
  </div>
  <div id="viewport">
    <svg id="planSvg" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
      <defs>
        <pattern id="stairPattern" patternUnits="userSpaceOnUse" width="16" height="16" patternTransform="rotate(45)">
          <rect width="16" height="16" fill="#eef1f5"/>
          <rect width="7" height="16" fill="#dfe5ec"/>
        </pattern>
      </defs>
      <g id="camera"><g id="floorLayer"></g></g>
    </svg>
    <div id="floorTitle"></div><div id="legend" class="heatLegend"><span>mniej lekcji</span><span class="heatBar"></span><span>więcej lekcji</span></div>
    <div id="status"></div>
    <div id="info"><button id="close">×</button><h2 id="roomTitle"></h2><div class="meta" id="roomMeta"></div><div id="roomSchedule"></div></div>
  </div>
</div>


<script>
const FLOORS={"ground":{"name":"Parter — segment A","w":1200,"h":720,"rooms":[["13","13",60,60,145,115,"room"],["14","14",205,60,70,115,"room"],["15","15",275,60,145,115,"room"],["K2","K-2",420,60,72,115,"stair"],["16","16",492,60,95,115,"room"],["K3","K-3",587,60,72,115,"stair"],["17","17",659,60,145,115,"room"],["18","18",804,60,72,115,"room"],["19","19",876,60,150,115,"room"],["K4","K-4",1026,60,72,115,"stair"],["corrG","korytarz",60,175,1038,82,"corridor"],["12","12",250,275,145,68,"room"],["11","11",250,343,145,68,"room"],["10","10",250,411,145,92,"room"],["9","9",250,503,145,92,"room"],["K1","K-1",250,595,85,72,"stair"],["coreG","komunikacja",420,275,165,330,"core"],["szat","SZATNIA",660,300,155,245,"space"],["23","23",815,315,170,145,"room"],["24","24",985,415,56,70,"room"],["21","21",1041,360,58,70,"room"],["20","20",1041,430,58,70,"room"]]},"floor1":{"name":"I piętro","w":1600,"h":760,"rooms":[["leftA","zaplecze",45,55,80,105,"space"],["leftB","kuchnia",125,55,90,105,"space"],["wcL","WC",215,55,55,105,"space"],["salaZ","sala zajęć",270,55,120,105,"space"],["117","117",390,55,130,105,"room"],["118","118",520,55,130,105,"room"],["119","119",650,55,65,105,"room"],["120","120",715,55,130,105,"room"],["121","121",845,55,75,105,"room"],["K2","K-2",920,55,68,105,"stair"],["122","122",988,55,145,105,"room"],["K3","K-3",1133,55,68,105,"stair"],["123","123",1201,55,100,105,"room"],["124","124",1301,55,55,105,"room"],["125","125",1356,55,125,105,"room"],["K4","K-4",1481,55,68,105,"stair"],["corr1","korytarz",45,160,1504,78,"corridor"],["salaW","sala zajęć",100,260,150,115,"space"],["116","116",250,260,65,70,"room"],["115","115",315,260,65,70,"room"],["zag1","zaplecze",380,260,95,100,"space"],["111","111",380,360,95,235,"room"],["110","110",735,260,140,90,"room"],["109","109",735,350,140,145,"room"],["K5","K-5",735,495,140,58,"stair"],["wcC","WC",735,553,90,75,"space"],["101","101",930,270,140,110,"room"],["102","102",930,380,140,95,"room"],["103","103",930,475,140,55,"room"],["104","104",930,530,140,60,"room"],["105","105",930,590,140,60,"room"],["130","130",1140,260,170,150,"room"],["129","129",1310,260,170,150,"room"],["wcR","WC",1480,260,70,150,"space"]]},"floor2":{"name":"II piętro","w":1710,"h":800,"rooms":[["217","217",40,55,145,105,"room"],["218","218",185,55,135,105,"room"],["219","219",320,55,65,105,"room"],["220","220",385,55,145,105,"room"],["221","221",530,55,145,105,"room"],["222","222",675,55,65,105,"room"],["223","223",740,55,140,105,"room"],["224","224",880,55,70,105,"room"],["K2","K-2",950,55,72,105,"stair"],["225","225",1022,55,145,105,"room"],["K3","K-3",1167,55,72,105,"stair"],["226","226",1239,55,140,105,"room"],["227","227",1379,55,65,105,"room"],["228","228",1444,55,140,105,"room"],["K4","K-4",1584,55,72,105,"stair"],["corr2","korytarz",40,160,1616,82,"corridor"],["216","216",75,260,65,95,"room"],["215","215",140,260,160,95,"room"],["wc214","WC 214",300,270,60,70,"space"],["wc213","WC 213",360,270,60,70,"space"],["212","212",420,270,52,55,"room"],["211","211",472,270,52,55,"room"],["210","210",524,270,76,55,"room"],["209","209",430,325,170,150,"room"],["208","208",760,270,150,95,"room"],["207","207",760,365,150,135,"room"],["K5","K-5",760,500,150,58,"stair"],["201","201",965,270,145,150,"room"],["202","202",965,420,145,95,"room"],["203","203",965,515,145,110,"room"],["233","233",1190,270,170,155,"room"],["232","232",1360,270,170,155,"room"],["wc2R","WC",1530,270,85,155,"space"]]},"preschool":{"name":"Przedszkole — parter","w":1200,"h":720,"rooms":[["21","21 szatnia",100,70,140,105,"room"],["20","20 sala zajęć",240,70,250,105,"room"],["20B","20B",490,70,75,55,"room"],["19B","19B",565,70,75,55,"room"],["20A","20A",490,125,75,55,"room"],["19A","19A",565,125,75,55,"room"],["19","19 sala zajęć",640,70,260,105,"room"],["corrP","korytarz",100,175,800,75,"corridor"],["22","22 sala ćwiczeń",150,270,290,170,"room"],["23","23 dyrektor",440,270,120,170,"room"],["wcP","WC",560,270,100,110,"space"],["18","18 magazyn",660,270,220,55,"room"],["17","17",660,325,220,55,"room"],["16","16 kredens",660,380,220,70,"room"],["15","15 szatnia personelu",660,450,220,70,"room"],["14","14 pokój nauczycielski",660,520,220,70,"room"],["13","13 intendent",660,590,220,70,"room"],["12","12 magazyn",760,660,120,45,"room"],["11","11 pralnia",660,660,100,45,"room"]]},"food":{"name":"Segment żywieniowy","w":1150,"h":720,"rooms":[["foodWC","WC",110,90,110,70,"space"],["mag1","magazyn żywności",110,160,220,80,"room"],["veg","obieralnia warzyw",110,240,220,80,"room"],["mag2","magazyn żywności",110,320,220,80,"room"],["prep","przygotowalnia",30,420,170,130,"room"],["dish","zmywalnia / kuchnia",200,420,130,130,"room"],["kitchen","kuchnia",330,90,280,310,"room"],["wash","zmywalnia",330,400,150,95,"room"],["store","magazyn",480,495,130,80,"room"],["canteen","stołówka",610,190,360,385,"room"],["segA","Segment A / komunikacja",610,90,360,100,"core"]]}};
let LESSONS={days:["Pn","Wt","Śr","Czw","Pi"],periods:[1,2,3,4,5,6,7,8,9],rooms:{},source:{}};
let floor="ground",cam={k:1,x:0,y:0},pointers=new Map(),lastPinch=null;
const svg=document.getElementById("planSvg"),camera=document.getElementById("camera"),layer=document.getElementById("floorLayer");
function esc(v){return String(v??"").replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function roomData(id){return LESSONS.rooms[String(id)]||{occupied_slots:0,free_slots:45,total_slots:45,occupancy:0,schedule:{}}}
function heatColor(rate,count){if(!count)return "#f4f6f8";var light=94-Math.round(Math.min(1,Number(rate)||0)*47);return "hsl(0 78% "+light+"%)"}
function make(tag,attrs,parent){parent=parent||layer;var e=document.createElementNS("http://www.w3.org/2000/svg",tag);Object.entries(attrs).forEach(function(kv){e.setAttribute(kv[0],kv[1])});parent.appendChild(e);return e}
function fontFor(w,h,label){var len=String(label).length,fs=Math.min(28,Math.max(10,Math.min(w/(len*.72),h*.32)));if(w<65)fs=Math.min(fs,13);return fs}
function buildTabs(){var t=document.getElementById("tabs");t.innerHTML="";Object.entries(FLOORS).forEach(function(ent){var id=ent[0],f=ent[1],b=document.createElement("button");b.className="tab"+(id===floor?" active":"");b.textContent=f.name;b.onclick=function(){floor=id;render();fit()};t.appendChild(b)})}
function render(){
  layer.innerHTML="";var f=FLOORS[floor];svg.setAttribute("viewBox","0 0 "+f.w+" "+f.h);document.getElementById("floorTitle").textContent=f.name;
  var roomCount=0,busyRooms=0,occupied=0;
  f.rooms.forEach(function(r){var id=r[0],label=r[1],x=r[2],y=r[3],w=r[4],h=r[5],kind=r[6],rd=roomData(id);if(kind==="room"){roomCount++;occupied+=rd.occupied_slots;if(rd.occupied_slots)busyRooms++}
    var rect=make("rect",{x:x+1,y:y+1,width:Math.max(2,w-2),height:Math.max(2,h-2),rx:5,ry:5,class:kind==="room"?"room"+(rd.occupied_slots?" busy":""):kind});
    if(kind==="room"){rect.setAttribute("fill",heatColor(rd.occupancy,rd.occupied_slots));rect.style.cursor="pointer";rect.setAttribute("tabindex","0");rect.setAttribute("aria-label",label+": "+rd.occupied_slots+" zajętych slotów z "+rd.total_slots);var open=function(e){e.stopPropagation();showRoom(id,label,rd)};rect.addEventListener("click",open);rect.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();open(e)}})}
    var fs=fontFor(w,h,label),tx=make("text",{x:x+w/2,y:y+h/2,class:kind==="room"?"roomLabel":"auxLabel","font-size":fs});tx.textContent=label;
    if(kind==="room"&&w>=70&&h>=60){var st=make("text",{x:x+w/2,y:y+h-10,class:"slotLabel","font-size":Math.max(9,Math.min(12,w*.09))});st.textContent=rd.occupied_slots?(rd.occupied_slots+"/"+rd.total_slots):"0/45"}
  });
  document.getElementById("status").textContent=roomCount+" sal • "+busyRooms+" używanych • "+occupied+" zajętych slotów tygodniowo";buildTabs();document.getElementById("info").classList.remove("show");
}
function showRoom(id,label,rd){
  document.getElementById("roomTitle").textContent=/^\d/.test(label)?"Sala "+label:label;document.getElementById("roomMeta").textContent=rd.occupied_slots+"/"+rd.total_slots+" zajętych slotów • "+rd.free_slots+" wolnych";
  var days=LESSONS.days,periods=LESSONS.periods,h='<table class="roomSchedule"><thead><tr><th>Lekcja</th>'+days.map(function(d){return "<th>"+esc(d)+"</th>"}).join("")+"</tr></thead><tbody>";
  periods.forEach(function(p){h+='<tr><td class="period">'+p+"</td>";days.forEach(function(d){var items=(((rd.schedule||{})[d]||{})[String(p)]||[]);h+="<td>"+(items.length?items.map(function(x){return '<div class="lessonItem"><b>'+esc(x.class)+'</b><span>'+esc(String(x.subject).replaceAll("_"," "))+'</span><small>'+esc(x.teacher||"")+"</small></div>"}).join(""):'<span class="freeSlot">wolna</span>')+"</td>"});h+="</tr>"});h+="</tbody></table>";
  document.getElementById("roomSchedule").innerHTML=h;document.getElementById("info").classList.add("show");
}
function applyCamera(){camera.setAttribute("transform","translate("+cam.x+" "+cam.y+") scale("+cam.k+")")}
function fit(){cam={k:1,x:0,y:0};applyCamera()}
function zoomAt(mult,cx,cy){var old=cam.k,nk=Math.max(1,Math.min(5,old*mult)),wx=(cx-cam.x)/old,wy=(cy-cam.y)/old;cam.k=nk;cam.x=cx-wx*nk;cam.y=cy-wy*nk;applyCamera()}
document.getElementById("plus").onclick=function(){var r=svg.getBoundingClientRect();zoomAt(1.18,r.width/2,r.height/2)};document.getElementById("minus").onclick=function(){var r=svg.getBoundingClientRect();zoomAt(1/1.18,r.width/2,r.height/2)};document.getElementById("fit").onclick=fit;document.getElementById("close").onclick=function(){document.getElementById("info").classList.remove("show")};
svg.addEventListener("wheel",function(e){e.preventDefault();var r=svg.getBoundingClientRect();zoomAt(e.deltaY<0?1.12:1/1.12,e.clientX-r.left,e.clientY-r.top)},{passive:false});
svg.addEventListener("pointerdown",function(e){svg.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY})});svg.addEventListener("pointermove",function(e){if(!pointers.has(e.pointerId))return;var prev=pointers.get(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});var pts=Array.from(pointers.values());if(pts.length===1&&cam.k>1){cam.x+=(e.clientX-prev.x)*(FLOORS[floor].w/svg.getBoundingClientRect().width);cam.y+=(e.clientY-prev.y)*(FLOORS[floor].h/svg.getBoundingClientRect().height);applyCamera()}else if(pts.length===2){var a=pts[0],b=pts[1],dist=Math.hypot(a.x-b.x,a.y-b.y),mid={x:(a.x+b.x)/2,y:(a.y+b.y)/2};if(lastPinch){var rect=svg.getBoundingClientRect();zoomAt(dist/lastPinch.dist,mid.x-rect.left,mid.y-rect.top)}lastPinch={dist:dist,mid:mid}}});
function endPointer(e){pointers.delete(e.pointerId);if(pointers.size<2)lastPinch=null}svg.addEventListener("pointerup",endPointer);svg.addEventListener("pointercancel",endPointer);
async function loadLessons(){try{var r=await fetch("/api/map/lessons",{cache:"no-store"});if(!r.ok)throw new Error("HTTP "+r.status);LESSONS=await r.json()}catch(e){document.getElementById("status").textContent="Nie udało się pobrać planu sal: "+e.message}}
loadLessons().finally(function(){render();fit()});
</script>
